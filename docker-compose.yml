services:
  # DynamoDB Local — used for local dev AND tests. Production talks to the real
  # regional DynamoDB endpoint (DYNAMODB_ENDPOINT unset), same code path.
  dynamodb:
    # Pinned to a release tag (latest == 3.3.1); multi-arch (amd64 + arm64).
    image: amazon/dynamodb-local:3.3.1
    container_name: de-dynamodb
    # -sharedDb keeps a single database file so every client (host backend,
    # tests, aws CLI, containers) sees the same tables.
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "8000:8000"
    volumes:
      - ./docker/dynamodb:/home/dynamodblocal/data

  # ElasticMQ — local, SQS-compatible queue for dev/test. Both the backend
  # producer and the DE-forEC2 worker talk to it via SQS_QUEUE_URL
  # (http://localhost:9324/000000000000/DE-Queue) + SQS_ENDPOINT
  # (http://localhost:9324). Production uses the real AWS SQS endpoint — leave
  # SQS_ENDPOINT empty there.
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: de-elasticmq
    ports:
      - "9324:9324"
    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: de-backend
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Talk to the sibling DynamoDB Local container, not localhost.
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      # Talk to the sibling ElasticMQ container (SQS-compatible).
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/DE-Queue
      AWS_REGION: ap-southeast-1
      USERS_TABLE: de-users
      SIMULATIONS_TABLE: de-simulations
      RESULTS_TABLE: de-simulation-results
      UNIQUENESS_TABLE: de-uniqueness
      # DynamoDB Local does not validate signatures, but the AWS SDK still
      # needs *some* credentials or it throws
      # "Could not load credentials from any providers".
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - dynamodb
      - elasticmq
