# ElasticMQ — local, SQS-compatible queue for dev/test.
# Mounted into the container at /opt/elasticmq.conf (see docker-compose.yml).
#
# Mirrors the real `DE-Queue` (region ap-southeast-1). Nothing here is secret;
# both the backend producer and the DE-forEC2 worker point SQS_QUEUE_URL at
# http://localhost:9324/000000000000/DE-Queue (SQS_ENDPOINT=http://localhost:9324).
#
# MUST NOT be used in production — AWS uses the real regional SQS endpoint
# (leave SQS_ENDPOINT empty there, exactly like DYNAMODB_ENDPOINT).

include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-address {
  protocol = http
  host = 0.0.0.0
  port = 9324
}

queues {
  DE-Queue {
    # Must comfortably exceed the longest DE run (an 800-model run at gen 2000
    # is ~1-2 min; keep parity with the worker's SQS_VISIBILITY_TIMEOUT).
    defaultVisibilityTimeout = 3600 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
  }
}
